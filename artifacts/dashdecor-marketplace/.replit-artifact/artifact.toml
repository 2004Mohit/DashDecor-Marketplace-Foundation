kind = "web"
previewPath = "/"
title = "DashDecor Marketplace"
description = "A premium Pune marketplace for interior and construction materials, helping homeowners, designers, and verified businesses browse, compare, and source materials from trusted sellers."
version = "1.0.0"
id = "artifacts/dashdecor-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21751

[services.development]
run = "pnpm --filter @workspace/dashdecor-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashdecor-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/dashdecor-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21751"
BASE_PATH = "/"
